# Publishes the image compose.yaml runs to
# ghcr.io/klutzydrummer/vastai-llmapi-orchestrator on every push to main,
# tagged `latest` and `sha-<commit>`. The offline tests run first, in the
# same build, and nothing is pushed if they fail.
name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Run the offline tests
        run: |
          docker buildx build --target test --tag orch-test --load \
            --cache-from type=gha --cache-to type=gha,mode=max .
          docker run --rm orch-test

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only main publishes; pull requests and other branches just build.
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
