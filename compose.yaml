# docker compose up -d --build        shim + watchdog, restarted automatically
# docker compose run --rm deploy check|apply|status|sweep|destroy|...
# docker compose run --rm test       offline test suite, touches nothing on Vast
#
# Before the first run: cp deploy/config.example.toml deploy/config.toml and
# cp shim/config.example.env shim/.env, then fill both in.

x-orch: &orch
  build: .
  image: vastai-llmapi-orchestrator
  env_file: shim/.env
  volumes:
    - orch-state:/data                                # deploy state.json (keep it)
    - ./deploy/config.toml:/config/config.toml:ro

services:
  shim:
    <<: *orch
    command: ["shim"]
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  watch:
    <<: *orch
    command: ["watch", "--interval", "60"]
    restart: unless-stopped

  # One-off commands: docker compose run --rm deploy <command>
  deploy:
    <<: *orch
    profiles: ["cli"]
    command: ["status"]

  # Offline tests: docker compose run --rm test
  test:
    build:
      context: .
      target: test
    image: vastai-llmapi-orchestrator:test
    profiles: ["cli"]

volumes:
  orch-state:
