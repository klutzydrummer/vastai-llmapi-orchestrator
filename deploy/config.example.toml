# Default: Pantheon-Reasoning 26B-A4B Q8_0 with vision, plus a Qwen3 embedding
# model, on 40 GB+ GPUs at <= $0.60/hr. For a cheaper setup on 24 GB
# GPUs with the same projector and embeddings, start from
# config.waifugemma4.example.toml instead.
# Copy to deploy/config.toml and edit. VAST_API_KEY comes from the environment.
# Every remote reference here (model revisions, this repo's ref, the image tag)
# is checked by `deploy.py check` and pinned to an exact commit/tag on apply,
# so a worker started next month boots exactly what you tested today.

[model]
served_name     = "pantheon"              # model id clients see; also used by the benchmark
repo            = "bartowski/Gryphe_Pantheon-Reasoning-26B-A4B-1.1-V2-GGUF"
file            = "Gryphe_Pantheon-Reasoning-26B-A4B-1.1-V2-Q8_0.gguf"
revision        = "main"                  # resolved to a commit sha on apply
# Pantheon is a Gemma 4 26B-A4B fine-tune; the base model's projector gives it vision.
mmproj_repo     = "unsloth/gemma-4-26B-A4B-it-GGUF"
mmproj_file     = "mmproj-BF16.gguf"
mmproj_revision = "main"

# Optional second model on the same GPU, served at /v1/embeddings. It runs as
# its own llama-server behind a small router on the worker. Remove this
# section for text generation only.
[embedding]
served_name = "qwen3-embedding"           # model id for /v1/embeddings
repo        = "Qwen/Qwen3-Embedding-0.6B-GGUF"
file        = "Qwen3-Embedding-0.6B-Q8_0.gguf"
revision    = "main"
ctx         = 4096                        # longest single input, in tokens; 8192 takes ~2.8 GiB more VRAM
pooling     = "last"                      # Qwen3-Embedding uses last-token pooling
gpu         = true                        # on the GPU next to the chat model; false = CPU (-ngl 0, slower, no VRAM)
cache_type  = "f16"                       # its context cache; the worker drops to q8_0 (and ctx to 2048) if VRAM is short

[llama]
image            = "ghcr.io/ggml-org/llama.cpp:server-cuda-b11371"   # upstream llama.cpp, pinned build (CUDA 12.8)
# Not every llama.cpp release gets an image; `check` names the newest older one if this tag is missing.
ctx              = 32768     # total context; shared by all slots (--kv-unified). A ceiling: never raised
ctx_min          = 16384     # the worker lowers ctx toward this if the GPU's free memory is short, and fails
                             # (before downloading) if even this doesn't fit; = ctx to never lower it
image_tokens     = 1120      # tokens of the largest image; the batch size (-ub) is raised to this with a projector
parallel         = 2         # slots; the Vast benchmark sends concurrent requests
cache_type       = "q8_0"    # KV cache type for K and V
reasoning_budget = -1        # Pantheon-Reasoning thinks before answering; 0 turns thinking off
extra_args       = ""        # extra llama-server flags, separate with ';'
min_vram_gb      = 40        # worker refuses to start below this (checked before downloading).
                             # Q8_0 chat + projector + embedding weights are ~27 GiB, plus KV cache
                             # and two CUDA contexts; 32 GB cards are too tight for 32k context.

[endpoint]
name               = "pantheon"
max_workers        = 1       # hard cap on GPUs billed at once
cold_workers       = 0       # stopped workers kept with weights on disk; 0 = destroy idle workers, re-download on next start
min_load           = 0       # 0 = allow scaling to zero running workers
target_util        = 0.9
cold_mult          = 1.0
inactivity_timeout = 900     # seconds idle before workers are released; verify in the dashboard
warm_hours         = ""      # e.g. "14:30-23:00": watch keeps a worker running then; "" = off
warm_tz            = ""      # IANA zone for warm_hours, e.g. "America/Chicago"; "" = machine clock (UTC in Docker)
warm_min_load      = 1       # min_load during warm_hours; above 0 asks the autoscaler to keep a worker up

[workergroup]
test_workers  = 1            # instances spun up to benchmark a new hardware type (default 3)
gpu_ram       = 40
# Your constraints live here: price ceiling (dph_total), VRAM floor (gpu_ram),
# CUDA driver floor for the image (cuda_max_good), GPU generation (compute_cap),
# download speed (inet_down). The server-cuda image (CUDA 12.8) ships compiled
# code for Ampere 8.6, Ada 8.9 and Blackwell 12.0, and PTX that the driver
# JIT-compiles on first start for the rest (Turing 7.5, A100 8.0, ...).
# compute_cap (x100) >= 800 keeps to Ampere and newer: older cards (P40, V100,
# Turing) lack features or have no prebuilt kernels, so their first load
# JIT-compiles for many minutes.
search_params = "num_gpus=1 gpu_ram>=40 dph_total<=0.60 cuda_max_good>=12.8 compute_cap>=800 inet_down>=500 reliability>0.98 direct_port_count>=1"

[limits]
# `check` (and so `apply`) refuses configs that could spend more than this.
# Worst case = (endpoint.max_workers + workergroup.test_workers) x the
# dph_total<= ceiling in search_params. Here: (1 + 1) x 0.60 = 1.20.
max_hourly_usd  = 1.20
max_workers_cap = 2          # endpoint.max_workers may not exceed this
on_breach       = "pause"    # watch: pause the endpoint when the account's running $/hr exceeds max_hourly_usd ("alert" = log only)
manual_ttl_s    = 14400      # rent-test instances stop themselves after this; sweep/watch then destroy them
stuck_grace_s   = 600        # watch: destroy a worker Vast still reports booting boot.deadline_s + download_max_s + this
                             # after first seen, and a rent-test instance Vast reports booting (no container) this long
rent_attempts   = 3          # rent-test: when a host fails to boot (stuck, Vast error, too slow) or its offer is taken, try another, up to this many
orphan_min_age_s = 900       # watch: a former worker must be off the worker list this long before it is destroyed

[template]
name    = "llmapi-orchestrator-pantheon"
disk_gb = 50                 # ~27 GiB of weights + image, venv and headroom (check computes it)

[boot]
orch_repo        = "klutzydrummer/vastai-llmapi-orchestrator"
orch_ref         = "main"    # resolved to a commit sha on apply
deadline_s       = 2400      # boot.sh start -> ready, not counting the weight download; else ORCH_FATAL
# The download has its own time budget, download_max_s, for all files
# together. After 90 s the worker projects the finish from the last minute's
# speed and fails early only if it would miss the budget (this host is too
# slow; another may not be). A download with no data for 2 minutes is
# restarted. Optional: download_min_mbps = N adds a fixed floor (MB/s).
download_max_s    = 5400      # ~29 GB: needs 5.4 MB/s on average
load_timeout_s   = 900
pyworker_ref     = "60cfeca889f979fd73cf9e00adcd7b0ebc016fdc"
vast_sdk_version = "1.8.3"
